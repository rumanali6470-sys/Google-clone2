<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="logo">
        
    </div>
    <div class="search-bar">
        <input type="text" placeholder="Ask Google">
        <i id="plus-icon" class="fa-solid fa-plus"></i>

        <div class="icon-btn" id="microphone-btn" data-tooltip="Search by voice">
            <i id="microphone-icon" class="fa-solid fa-microphone-lines"></i>
        </div>

        <div class="icon-btn" id="camera-btn" data-tooltip="Search by image">
            <i id="camera-icon" class="fa-regular fa-camera"></i>
        </div>
    </div>

    <div class="shortcuts">
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-youtube"></div>
            <span class="shortcut-name">youtube</span>
        </a>
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-whatsapp"></div>
            <span class="shortcut-name">whatsapp</span>
        </a>
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-leopard"></div>
            <span class="shortcut-name">leopard</span>
        </a>
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-ads"></div>
            <span class="shortcut-name">ads manager</span>
        </a>
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-chatgpt"></div>
            <span class="shortcut-name">chatgpt</span>
        </a>
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-instagram"></div>
            <span class="shortcut-name">instagram</span>
        </a>
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-tiktok"></div>
            <span class="shortcut-name">tiktok</span>
        </a>
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-facebook"></div>
            <span class="shortcut-name">facebook</span>
        </a>
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-business"></div>
            <span class="shortcut-name">business manager</span>
        </a>
        <a href="#" class="shortcut">
            <div class="shortcut-circle" id="sc-daad"></div>
            <span class="shortcut-name">Daad International</span>
        </a>
    </div>

    <div class="show-less">
        <a href="#" class="shortcut">
            <div class="shortcut-circle"><i class="fa-solid fa-compress"></i></div>
            <span class="shortcut-name">Show less</span>
        </a>
    </div>

    <a href="#" class="gmail">Gmail</a>
    <a href="#" class="images">Images</a>
    <i id="grip-icon" class="fa-solid fa-grip"></i>

    <div class="dp-logo">

    </div>


    <!-- <a href="#" class="anchor-youtube"><div class="youtube-box">
        <div class="youtube-logo"></div>
        <p class="text-youtube">Youtube</p>

    </div></a> -->
</body>
</html>
